<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rasin - Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body class="auth">

  <div class="auth-brand">
    <a href="index.html" class="sidebar-logo"><span class="logo-mark">R</span>Rasin</a>
    <p>AI suggests. You approve.</p>
  </div>

  <div class="auth-card">
    <h1>Log in</h1>

    <!-- Static demo: the form goes straight to the dashboard. In Laravel: action="/login" method="post" -->
    <form class="form" action="dashboard.html">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="name@company.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-block">Log in</button>
    </form>

    <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
  </div>

</body>
</html>
